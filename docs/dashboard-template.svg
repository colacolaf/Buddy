<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- Paper -->
  <rect x="10" y="10" width="780" height="580" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="400" y="36" font-family="'Courier New', monospace" font-size="12" fill="#555" text-anchor="middle">Main Dashboard — Template</text>

  <!-- ★ ALERTS (top banner) -->
  <rect x="40" y="48" width="720" height="26" rx="3" fill="none" stroke="#888" stroke-width="1"/>
  <text x="400" y="66" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#666">ALERTS &amp; NOTIFICATIONS</text>

  <!-- 📅 CALENDAR WEEK STRIP (full width) -->
  <rect x="40" y="82" width="720" height="46" rx="3" fill="#fafaf8" stroke="#888" stroke-width="1"/>
  <text x="400" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#555">📅  THIS WEEK</text>
  <text x="400" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#999">MON · TUE · WED · THU · FRI · SAT · SUN</text>
  <text x="115" y="112" font-family="'Courier New', monospace" font-size="6" fill="#aaa">● 9am</text>
  <text x="206" y="112" font-family="'Courier New', monospace" font-size="6" fill="#aaa">● 2pm</text>
  <text x="570" y="112" font-family="'Courier New', monospace" font-size="6" fill="#aaa">● 7pm</text>
  <text x="400" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#aaa">3 events this week — Standup · Dentist · Dinner</text>

  <!-- ═══════════ 2-COLUMN BELOW ═══════════ -->

  <!-- ── LEFT COLUMN ── -->
  <!-- Single Win -->
  <rect x="40" y="140" width="250" height="65" rx="3" fill="none" stroke="#777" stroke-width="1.3"/>
  <text x="165" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#555" font-weight="bold">★ TODAY'S SINGLE WIN</text>
  <line x1="50" y1="166" x2="280" y2="166" stroke="#ddd" stroke-width="0.5"/>
  <text x="165" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#888">Complete Chem Chapter 4 practice</text>

  <!-- Buddy -->
  <rect x="40" y="215" width="250" height="135" rx="5" fill="#fafaf8" stroke="#777" stroke-width="1.4"/>
  <text x="165" y="238" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#555" font-weight="bold">🐾  BUDDY</text>
  <line x1="55" y1="245" x2="275" y2="245" stroke="#ddd" stroke-width="0.5"/>
  <circle cx="165" cy="278" r="28" fill="#f0ece6" stroke="#bbb" stroke-width="0.8"/>
  <text x="165" y="283" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#bbb">character</text>
  <text x="165" y="320" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaa">state: idle / focused</text>
  <text x="165" y="338" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#ccc">(click to expand chat)</text>

  <!-- Goals -->
  <rect x="40" y="360" width="250" height="85" rx="3" fill="none" stroke="#888" stroke-width="1"/>
  <text x="165" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#666">🎯  GOALS PROGRESS</text>
  <line x1="50" y1="386" x2="280" y2="386" stroke="#ddd" stroke-width="0.5"/>
  <text x="50" y="404" font-family="'Courier New', monospace" font-size="8" fill="#aaa">Get A in Chemistry  ████░░░░  60%</text>
  <text x="50" y="422" font-family="'Courier New', monospace" font-size="8" fill="#aaa">History essay        ██░░░░░░  30%</text>
  <text x="50" y="440" font-family="'Courier New', monospace" font-size="8" fill="#aaa">Essay project        ██████░░  85%</text>

  <!-- ── RIGHT COLUMN ── -->
  <!-- Blocking Status -->
  <rect x="310" y="140" width="450" height="65" rx="3" fill="none" stroke="#888" stroke-width="1"/>
  <text x="535" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#666">🛡  BLOCKING STATUS</text>
  <line x1="320" y1="166" x2="750" y2="166" stroke="#ddd" stroke-width="0.5"/>
  <circle cx="335" cy="185" r="6" fill="#d4e8d0" stroke="#8ab87a" stroke-width="0.8"/>
  <text x="348" y="189" font-family="'Courier New', monospace" font-size="9" fill="#777">Focus Block: ACTIVE</text>
  <text x="335" y="205" font-family="'Courier New', monospace" font-size="7" fill="#aaa">Leisure budget: ████░░░░  42 of 60 min remaining</text>

  <!-- Focus Stats + Done List -->
  <rect x="310" y="215" width="450" height="135" rx="3" fill="none" stroke="#888" stroke-width="1"/>
  <text x="535" y="235" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#666">📊  FOCUS STATS  +  ✅  DONE LIST</text>
  <line x1="320" y1="241" x2="750" y2="241" stroke="#ddd" stroke-width="0.5"/>
  <!-- Stats -->
  <text x="340" y="264" font-family="Georgia, serif" font-size="20" fill="#555">2h 15m</text>
  <text x="340" y="284" font-family="'Courier New', monospace" font-size="7" fill="#aaa">focused today</text>
  <text x="450" y="264" font-family="Georgia, serif" font-size="20" fill="#555">3/5</text>
  <text x="450" y="284" font-family="'Courier New', monospace" font-size="7" fill="#aaa">tasks done</text>
  <line x1="420" y1="250" x2="420" y2="285" stroke="#ddd" stroke-width="0.5"/>
  <!-- Done List -->
  <text x="530" y="260" font-family="'Courier New', monospace" font-size="9" fill="#666">✅ DONE TODAY:</text>
  <text x="530" y="280" font-family="'Courier New', monospace" font-size="8" fill="#888">☑ Chem Ch.4 practice — 10:30am</text>
  <text x="530" y="296" font-family="'Courier New', monospace" font-size="8" fill="#888">☑ Email study group — 11:45am</text>
  <text x="530" y="312" font-family="'Courier New', monospace" font-size="8" fill="#888">☑ Clean desk — 12:15pm</text>

  <!-- Remaining Tasks -->
  <rect x="310" y="360" width="450" height="85" rx="3" fill="none" stroke="#888" stroke-width="1"/>
  <text x="535" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#666">📋  REMAINING TASKS</text>
  <line x1="320" y1="386" x2="750" y2="386" stroke="#ddd" stroke-width="0.5"/>
  <text x="330" y="404" font-family="'Courier New', monospace" font-size="9" fill="#aaa">☐ History essay draft</text>
  <text x="330" y="422" font-family="'Courier New', monospace" font-size="9" fill="#aaa">☐ Email professor about grade</text>

  <!-- ═══════════ BOTTOM ACTION BAR ═══════════ -->
  <line x1="40" y1="460" x2="760" y2="460" stroke="#ddd" stroke-width="0.5"/>

  <!-- Quick Action Buttons -->
  <text x="80" y="482" font-family="'Courier New', monospace" font-size="9" fill="#888">▶ Start Focus</text>
  <text x="210" y="482" font-family="'Courier New', monospace" font-size="9" fill="#888">＋ Add Task</text>
  <text x="340" y="482" font-family="'Courier New', monospace" font-size="9" fill="#888">✓ Mark Done</text>

  <!-- Fresh Start - distinct green -->
  <rect x="490" y="470" width="200" height="20" rx="10" fill="none" stroke="#5a8" stroke-width="1"/>
  <text x="590" y="483" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#5a8">✉  Fresh Start — clear overdue</text>

  <!-- Navigation -->
  <rect x="40" y="500" width="720" height="24" rx="3" fill="none" stroke="#888" stroke-width="1"/>
  <text x="400" y="516" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">🏠 Dashboard · 📅 Calendar · 🎯 Goals · 📊 Stats · ⚙ Settings</text>

  <!-- Footer -->
  <text x="400" y="550" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#ccc">NEW 1: Calendar Header — full-width week strip · 2-column below · Fresh Start in action bar</text>
</svg>
